# Milu's server: the iPhone app's speech to text and local LLM, behind one API.
#
#   api     relays the app's questions and tools to the LLM, its recordings to speech
#   speech  Vietnamese speech to text on the CPU (sherpa-onnx, Zipformer)
#   llm     Ollama with gemma on the GPU (profile "llm", on since Timi's was stopped)
#   tunnel  https://milu-api.nnqlab.dev → api, through Cloudflare
#
# Nothing publishes a port. Start or update: `docker compose up -d --build`.
# Settings in .env (owner-only); .env.example lists them.
#
# The GPU holds one copy of the model. While the Timi web (project "finance")
# runs, its Ollama is used through compose.shared-llm.yaml, which COMPOSE_FILE
# in .env adds. The day Timi stops, in .env:
#   COMPOSE_FILE=compose.yaml
#   COMPOSE_PROFILES=llm
#   OLLAMA_URL=http://llm:11434
# then `docker compose up -d`: the models already downloaded are in the
# finance-ollama volume, which llm keeps using.
name: milu-server

services:
  api:
    build: ./api
    image: milu-server-api
    environment:
      MILU_API_KEYS: ${MILU_API_KEYS:?Set MILU_API_KEYS in .env}
      OLLAMA_URL: ${OLLAMA_URL:-http://llm:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e4b}
      STT_URL: http://speech:8000
    depends_on:
      speech:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  speech:
    build: ./speech
    image: milu-server-speech
    environment:
      STT_THREADS: "4"
    # A sentence takes about 50 ms; four cores leave the rest of the server alone.
    cpus: 4
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Off until the Timi web stops (COMPOSE_PROFILES=llm): two copies of the
  # model do not fit the GPU. One model stays loaded (about 5 GB of VRAM).
  llm:
    image: ollama/ollama:0.35.0
    profiles: [llm]
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
      WARM_MODEL: ${OLLAMA_MODEL:-gemma4:e4b}
      # CUDA's compiled kernels kept in the volume, compiled once, not after every start.
      CUDA_CACHE_PATH: /root/.ollama/cuda-cache
      CUDA_CACHE_MAXSIZE: "4294967296"
    # The model loaded as soon as the server starts: its first load takes about
    # 30 s, longer than a question waits.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve & pid=$$!
        trap 'kill -TERM $$pid' TERM INT
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama run "$$WARM_MODEL" --think=false "hi" </dev/null >/dev/null 2>&1 || echo "Could not load $$WARM_MODEL" >&2
        wait $$pid; wait $$pid
    volumes:
      - models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # HTTP/2, not QUIC, which kept dropping on the home line.
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    command:
      - tunnel
      - --no-autoupdate
      - --protocol
      - http2
      - run
      - --url
      - http://api:8000
      - --credentials-file
      - /etc/cloudflared/milu.json
      - ${MILU_TUNNEL_ID:?Set MILU_TUNNEL_ID in .env}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ${HOME}/.cloudflared/${MILU_TUNNEL_ID}.json:/etc/cloudflared/milu.json:ro
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  # Downloaded models, shared with the Timi web's Ollama until it stops.
  models:
    external: true
    name: finance-ollama
